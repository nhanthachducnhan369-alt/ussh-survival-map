<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bản đồ Sinh tồn USSH – ĐHQGHN</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Thanh tìm kiếm & bộ lọc 2 cấp -->
    <header class="top-controls">
      <div class="search-row">
        <input
          id="searchInput"
          type="search"
          placeholder="Tìm giảng đường, quán cơm, chỗ chạy DL..."
          autocomplete="off"
        />
        <button id="toggleViewBtn" class="btn-ghost" type="button">
          Danh sách
        </button>
        <button id="clearFiltersBtn" class="btn-ghost" type="button" disabled>
          Xóa lọc
        </button>
      </div>

      <!-- Cấp 1: Nhóm nhu cầu -->
      <div id="catChips" class="chip-row" role="group" aria-label="Nhóm địa điểm"></div>

      <!-- Cấp 2: Trạng thái & Tag ngữ cảnh -->
      <div id="tagChips" class="chip-row tag-row" role="group" aria-label="Bộ lọc ngữ cảnh"></div>

      <!-- Banner gợi ý khi kết quả = 0 -->
      <div id="emptyHintBanner" class="empty-hint hidden" role="status"></div>
    </header>

    <!-- Chế độ Bản đồ -->
    <main id="map"></main>

    <!-- Chế độ Danh sách sắp xếp theo khoảng cách -->
    <section id="listView" class="list-view hidden" aria-label="Danh sách địa điểm">
      <div class="list-header">
        <span id="listSummary" class="list-summary"></span>
      </div>
      <div id="listContainer" class="list-items"></div>
    </section>

    <!-- Nút định vị nổi -->
    <button id="locateBtn" class="fab-locate" type="button" aria-label="Định vị của tôi">
      📍 Vị trí của tôi
    </button>

    <!-- Thẻ thông tin địa điểm (Bottom Sheet) -->
    <section id="placeSheet" class="bottom-sheet hidden" aria-live="polite">
      <div class="sheet-handle-bar">
        <button id="toggleExpandBtn" class="sheet-handle" type="button" aria-label="Mở rộng hoặc thu gọn thẻ">
          <span class="handle-pill"></span>
        </button>
        <button id="closeSheetBtn" class="btn-close" type="button" aria-label="Đóng thẻ">✕</button>
      </div>
      <div id="sheetContent" class="sheet-body"></div>
    </section>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script src="./js/app.js"></script>
</body>
</html>
